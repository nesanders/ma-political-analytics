<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/askai.css' | relative_url }}">
  <script src="{{ '/assets/js/vendor/vega-5.33.1.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/vendor/vega-lite-5.23.0.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/vendor/vega-embed-6.29.0.min.js' | relative_url }}"></script>
</head>
<body data-site-baseurl="{{ site.baseurl }}" data-askai-page-title="{{ page.title | default: site.title | escape }}" data-askai-page-description="{{ page.description | default: site.description | escape }}">
  <header>
    <nav>
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <a href="{{ '/chamber/house/' | relative_url }}">House</a>
      <a href="{{ '/chamber/senate/' | relative_url }}">Senate</a>
      <a href="{{ '/map/' | relative_url }}">Map</a>
      <a href="{{ '/district/' | relative_url }}">Districts</a>
      <a href="{{ '/candidate/' | relative_url }}">Candidates</a>
      <a href="{{ '/town/' | relative_url }}">Towns</a>
      <a href="{{ '/party/' | relative_url }}">Parties</a>
      <a href="{{ '/search/' | relative_url }}">Search &amp; Compare</a>
      <a href="{{ '/methodology/' | relative_url }}">Methodology</a>
    </nav>
    <div id="header-search">
      <input type="search" id="header-search-input" placeholder="Quick search&hellip;" autocomplete="off" aria-label="Search seats, candidates, towns, parties">
      <div id="header-search-dropdown" hidden></div>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>Data pipeline and methodology: <a href="https://github.com/nesanders/ma-political-analytics">source</a>.</p>
  </footer>
  <script src="{{ '/assets/js/sortable-tables.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/search.js' | relative_url }}"></script>
  <div id="askai-root"></div>
  <script type="module" src="{{ '/assets/js/askai.bundle.js' | relative_url }}"></script>
</body>
</html>
