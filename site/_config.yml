title: MA Political Analytics
description: >-
  Candidates, districts, and party lean for Massachusetts state legislative
  races, back through three redistricting cycles.
url: "" # set to the Pages URL once known (or leave blank for a project page)
baseurl: "" # set to "/ma-political-analytics" if served from a project page path

markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  candidates:
    output: true
    permalink: /candidate/:path/
  seats:
    output: true
    permalink: /seat/:path/
  districts:
    output: true
    permalink: /district/:path/
  towns:
    output: true
    permalink: /town/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
