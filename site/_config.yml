title: MA Political Analytics
description: >-
  Candidates, districts, and party lean for Massachusetts state legislative
  races, back through three redistricting cycles.
url: "https://nsanders.me"
baseurl: "/ma-political-analytics"

markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  candidates:
    output: true
    permalink: /candidate/:path/
  seats:
    output: true
    permalink: /seat/:path/
  districts:
    output: true
    permalink: /district/:path/
  towns:
    output: true
    permalink: /town/:path/
  parties:
    output: true
    permalink: /party/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  # AskAI's JS project (src/askai): npm source, config, and node_modules,
  # none of which is a Jekyll page. Its build output that the site actually
  # serves lives under assets/js/askai.bundle.js, not here.
  - src
