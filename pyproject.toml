[project]
name = "ma-politics-pipeline"
version = "0.1.0"
description = "Data pipeline for the MA political analytics dashboard"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyarrow>=17.0",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ma_politics*"]
where = ["pipeline"]
